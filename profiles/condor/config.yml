
executor: htcondor
max-jobs-per-second: 1
seconds-between-status-checks: 60
max-status-checks-per-second: 0.01
latency-wait: 120
jobs: 32
local-cores: 4
rerun-incomplete: 1
keep-going: 1
scheduler: greedy
retries: 2


default-resources:
  - universe="vanilla"
  - getenv=True
  - htcondor_request_memory=4GB
  - htcondor_request_disk_mb=4096
  - classad_JobFlavour=tomorrow
